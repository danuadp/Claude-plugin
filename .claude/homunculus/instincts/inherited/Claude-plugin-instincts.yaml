# Claude Plugin Workflow Merge Parallel Plugin Scaffolds

## Action

Follow the merge-parallel-plugin-scaffolds workflow:
1. Identify overlapping files between scaffolds (e.g., agent definitions, README, plugin.json, hooks).
2. For each overlap, select the stronger or more complete version, sometimes merging content.
3. Update documentation (README.md, PLUGIN_SCHEMA_NOTES.md) to reflect merged features and conventions.
4. Update configuration files (plugin.json, hooks.json, .gitignore) to include all relevant entries from both scaffolds.
5. Relax or adjust validation rules in scripts/ci/validate-plugin.js as needed to accommodate merged conventions.
6. Add or update tests to ensure merged functionality passes.
7. Commit all changes together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .claude-plugin/PLUGIN_SCHEMA_NOTES.md, .claude-plugin/plugin.json, .gitignore

